# Celula Fase 3 (nao editar a mao: sha256 registrado em runs/*/env/inputs-sha256.txt)
# celula=geo9pue_azure_realjun_folgada base=geo_9dc_azure.yaml
# PUE remapeado invertido: mais limpo=1.5, mais sujo=1.12, interpolacao linear pelo posto de limpeza
# nota: pelo criterio da media anual o DC mais sujo e johannesburg (900.64), nao canberra (666.97)
# tabela DC -> PUE (ordenada pelo posto de limpeza):
#   paris: media=52.60 -> pue=1.5
#   sp: media=61.70 -> pue=1.4525
#   virginia: media=342.80 -> pue=1.405
#   seoul: media=415.59 -> pue=1.3575
#   singapore: media=494.99 -> pue=1.31
#   dubai: media=530.01 -> pue=1.2625
#   canberra: media=666.97 -> pue=1.215
#   pune: media=702.81 -> pue=1.1675
#   johannesburg: media=900.64 -> pue=1.12
# Scenario B-Azure: Geo-distributed 9-DC federation with Azure 2020 trace workload
#
# Same infrastructure and carbon traces as geo_9dc.yaml, but the workload is
# derived from the Azure Packing 2020 production trace (Vasconcelos et al.
# SMARTGREENS 2022 reference). First 2000 VMs subsampled, demands capped at
# the largest host capacity (170240 MIPS).

scenario:
  name: geo9pue_azure_realjun_folgada
  duration_seconds: 14400
  dt_seconds: 60
  migration_interval_seconds: 600
  seed: 42
  start_datetime: "2020-06-01T00:00:00"

topology:
  platform_xml: ""

