# Celula em2021 (derivada de configs/scenarios/geo_9dc_google.yaml)
# workload=google carbon=em2021(real, Electricity Maps) load=folgada
# Scenario B-Google: Geo-distributed 9-DC federation with Google 2011 trace workload
#
# DIFERENCA EM RELACAO AO YAML DE ORIGEM:
#   (a) carbon: aponta para data/carbon/em2021/<dc>.csv (medido, Electricity
#       Maps Academic License, ano civil 2021) em vez de data/carbon/<dc>.csv
#       (sintetico-em-forma, LowCarbonCloud 2020 re-rotulado);
#   (b) cada entrada de carbon ganha data_start_datetime: "2021-01-01T00:00:00"
#       (epoch dos CSVs em2021, 8760 amostras horarias); SEM este campo, o
#       loader (src/scenario/scenario_builder.cpp) assume o default
#       "2020-01-01T00:00:00", que seria incorreto para dados de 2021;
#   (c) scenario.start_datetime muda de "2020-06-01T00:00:00" para
#       "2021-06-01T00:00:00"; preserva a mesma janela sazonal (1 de junho,
#       00:00 UTC) do YAML de origem, agora FUNCIONAL (nao inerte) porque
#       data_start_datetime foi explicitado (offset de 13.046.400 s =
#       151 dias = 3624 h).
# TODO O RESTANTE (topologia, host_groups, pue, workload, n_vms=2000,
# duration_seconds, dt_seconds, migration_interval_seconds) e IDENTICO ao
# YAML de origem (geo_9dc_google.yaml), inclusive a carga "folgada" (n_vms=2000,
# menor que a celula "alta" com n_vms=9000).
#
# Same infrastructure and carbon traces as geo_9dc.yaml, but the workload is
# derived from the Google Cluster 2011 production trace (Vasconcelos et al.
# SMARTGREENS 2022 reference). First 2000 VMs subsampled, demands capped at
# the largest host capacity (170240 MIPS).
#
# LICENCA DOS DADOS DE CARBONO (Electricity Maps Academic License):
# uso academico; citacao obrigatoria em publicacoes; REDISTRIBUICAO PROIBIDA.
# Ver ../../../data/carbon/em2021_raw/README.md e
# ../../../data/carbon/em2021/README-LICENCA.md.

scenario:
  name: geo9_google_em2021_folgada
  duration_seconds: 14400
  dt_seconds: 60
  migration_interval_seconds: 600
  seed: 42
  start_datetime: "2021-06-01T00:00:00"

