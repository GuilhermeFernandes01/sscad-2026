# Celula Fase 3 (nao editar a mao: sha256 registrado em runs/*/env/inputs-sha256.txt)
# celula=geo9hetcap_azure_anticorr_folgada base=fase1/geo9_azure_anticorr_folgada.yaml
# capacidades desiguais anti-correlacionadas com a limpeza: mais limpo=20 hosts, mais sujo=80, interpolacao linear pelo posto (soma=450)
# arredondamento: floor + maior resto (empate: posto mais limpo; classes 50/30/20: ordem small>med>large)
# tabela DC -> hosts (ordenada pelo posto de limpeza):
#   paris: media=52.60 -> hosts=20 (classes 16c/32c/64c = 10/6/4)
#   sp: media=61.70 -> hosts=28 (classes 16c/32c/64c = 14/8/6)
#   virginia: media=342.80 -> hosts=35 (classes 16c/32c/64c = 18/10/7)
#   seoul: media=415.59 -> hosts=43 (classes 16c/32c/64c = 21/13/9)
#   singapore: media=494.99 -> hosts=50 (classes 16c/32c/64c = 25/15/10)
#   dubai: media=530.01 -> hosts=57 (classes 16c/32c/64c = 29/17/11)
#   canberra: media=666.97 -> hosts=65 (classes 16c/32c/64c = 33/19/13)
#   pune: media=702.81 -> hosts=72 (classes 16c/32c/64c = 36/22/14)
#   johannesburg: media=900.64 -> hosts=80 (classes 16c/32c/64c = 40/24/16)
# Scenario B-Azure: Geo-distributed 9-DC federation with Azure 2020 trace workload
#
# Same infrastructure and carbon traces as geo_9dc.yaml, but the workload is
# derived from the Azure Packing 2020 production trace (Vasconcelos et al.
# SMARTGREENS 2022 reference). First 2000 VMs subsampled, demands capped at
# the largest host capacity (170240 MIPS).

scenario:
  name: geo9hetcap_azure_anticorr_folgada
  duration_seconds: 14400
  dt_seconds: 60
  migration_interval_seconds: 600
  seed: 42
  start_datetime: "2020-06-01T00:00:00"

topology:
  platform_xml: ""

