# Celula Fase 1 (nao editar a mao: sha256 registrado em runs/*/env/inputs-sha256.txt)
# workload=google carbon=flat load=folgada
# Scenario B-Google: Geo-distributed 9-DC federation with Google 2011 trace workload
#
# Same infrastructure and carbon traces as geo_9dc.yaml, but the workload is
# derived from the Google Cluster 2011 production trace (Vasconcelos et al.
# SMARTGREENS 2022 reference). First 2000 VMs subsampled, demands capped at
# the largest host capacity (170240 MIPS).

scenario:
  name: geo9_google_flat_folgada
  duration_seconds: 14400
  dt_seconds: 60
  migration_interval_seconds: 600
  seed: 42
  start_datetime: "2020-06-01T00:00:00"

topology:
  platform_xml: ""

